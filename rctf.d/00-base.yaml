homeContent: |
  # Welcome to CompIT 2026 CTF!
  
  **CompIT (Competition IT)** is an internal competition for students of the Department of Information Technology, Institut Teknologi Sepuluh Nopember (ITS).
  
  ### 🚩 Competition Guidelines
  - **Categories:** Cryptography, Web Exploitation, Binary Exploitation, Digital Forensic, Reverse Engineering, and Miscellaneous.
  - **Scoring:** Dynamic Scoring (points decrease as more teams solve each challenge).
  - **Flag Format:** `compit{...}`
  - **Team Credentials:** Official credentials are provided directly by the committee.
  - **Top 10:** Must submit an official write-up at the end of the competition.
  
  *Good luck, play fair, and have fun!*

