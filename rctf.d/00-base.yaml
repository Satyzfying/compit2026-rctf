homeContent: |
  # Selamat Datang di CompIT 2026 CTF!
  
  **CompIT (Competition IT)** adalah ajang kompetisi internal mahasiswa Departemen Teknologi Informasi Institut Teknologi Sepuluh Nopember (ITS).
  
  ### 🚩 Ketentuan Lomba
  - **Kategori Soal:** Cryptography, Web Exploitation, Binary Exploitation, Digital Forensic, Reverse Engineering, dan Miscellaneous.
  - **Scoring:** Dynamic Scoring (bobot nilai berkurang seiring bertambahnya solver).
  - **Flag Format:** `compit{...}`
  - **Ketentuan Akun:** Kredensial akun tim dibagikan secara resmi oleh panitia.
  - **Top 10:** Wajib mengumpulkan write-up resmi di akhir kompetisi.
  
  *Selamat bertanding dan junjung tinggi sportivitas!*

