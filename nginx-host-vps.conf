# Konfigurasi Nginx Host VPS untuk CompIT 2026 CTF
# Letakkan di /etc/nginx/sites-available/compit.conf dan symlink ke /etc/nginx/sites-enabled/

# Rate limiting zones: mitigasi brute-force login & perlindungan umum DoS
# Disesuaikan untuk NAT WiFi/Lab Kampus ITS (mencegah false-positive lockout massal)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

server {
    listen 80;
    server_name 134.199.201.167 ctf.compit.its.ac.id _;

    client_max_body_size 64M;

    # Rate limiting endpoint login (ramah NAT kampus: burst 30, rate 60r/m)
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=150 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
