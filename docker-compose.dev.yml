services:
  postgres:
    image: postgres:16-alpine
    container_name: compit-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ruarua
      POSTGRES_DB: rctf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rctf"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: compit-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
